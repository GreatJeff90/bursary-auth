<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UniPort Bursary</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #003366; /* UniPort Blue */
            --secondary: #ffffff; /* White */
            --accent: #0099cc; /* Lighter blue accent */
            --light: #f8fafc; /* Light background */
            --text-dark: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            background-color: var(--light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--secondary);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .login-header {
            padding: 32px 32px 24px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo img {
            height: 42px;
            width: auto;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .login-header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .login-form {
            padding: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .input-container {
            position: relative;
        }

        .input-container i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            background: var(--secondary);
            color: var(--text-dark);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
        }

        .form-control.error {
            border-color: var(--error);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1rem;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
        }

        .remember-me input {
            accent-color: var(--primary);
        }

        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: var(--secondary);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }

        .login-btn:hover {
            background: var(--accent);
        }

        .login-btn:active {
            transform: translateY(1px);
        }

        .login-btn:disabled {
            background: var(--text-light);
            cursor: not-allowed;
        }

        .signup-section {
            text-align: center;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-size: 0.95rem;
            color: var(--text-light);
        }

        .signup-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .signup-link:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error message */
        .error-message {
            display: none;
            background: #fef2f2;
            color: var(--error);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
            font-size: 0.9rem;
            text-align: center;
        }

        .error-message i {
            margin-right: 8px;
        }

        /* Success message */
        .success-message {
            display: none;
            background: #f0f9ff;
            color: var(--success);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bae6fd;
            font-size: 0.9rem;
            text-align: center;
        }

        .success-message i {
            margin-right: 8px;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-container {
                max-width: 100%;
            }
            
            .login-header, .login-form {
                padding: 24px;
            }
            
            .logo img {
                height: 36px;
            }
            
            .logo-text {
                font-size: 1.3rem;
            }
            
            .login-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <img src="https://www.uniport.edu.ng/wp-content/themes/unipix/assets/images/logo/uniport_logo1.png" alt="UniPort Logo">
                <div class="logo-text">UniPort Bursary</div>
            </div>
            
            <h1>Welcome back</h1>
            <p>Sign in to your bursary account</p>
        </div>
        
        <form class="login-form" id="loginForm">
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i>
                <span id="successText"></span>
            </div>
            
            <div class="form-group">
                <label for="username">Student ID or Email</label>
                <div class="input-container">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" class="form-control" placeholder="Enter your student ID or email" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
            </div>
            
            <button type="submit" class="login-btn" id="loginButton">
                Sign In
            </button>
            
            <div class="signup-section">
                Don't have an account? <a href="signup.html" class="signup-link">Sign up</a>
            </div>
        </form>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Function to validate user credentials
        function validateUser(username, password) {
            // Get stored users from localStorage
            const storedUsers = JSON.parse(localStorage.getItem('uniportUsers')) || [];
            
            // Check if user exists with provided username/email
            const user = storedUsers.find(user => 
                user.email === username || user.studentId === username
            );
            
            if (!user) {
                return { 
                    success: false, 
                    message: "No account found with this username or email. Please check your credentials or sign up for a new account." 
                };
            }
            
            // Check if password matches (in a real app, this would be hashed)
            // For demo purposes, we're using simple base64 encoding
            const encodedPassword = btoa(password);
            if (user.password !== encodedPassword) {
                return { 
                    success: false, 
                    message: "Incorrect password. Please try again or use 'Forgot Password' to reset your password." 
                };
            }
            
            return { 
                success: true, 
                message: "Login successful!",
                user: user
            };
        }

        // Function to display error message
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const successMessage = document.getElementById('successMessage');
            
            // Hide success message if visible
            successMessage.style.display = 'none';
            
            // Show error message
            errorText.textContent = message;
            errorMessage.style.display = 'block';
            
            // Add error class to form inputs
            document.getElementById('username').classList.add('error');
            document.getElementById('password').classList.add('error');
            
            // Auto-hide error after 5 seconds
            setTimeout(() => {
                errorMessage.style.display = 'none';
                document.getElementById('username').classList.remove('error');
                document.getElementById('password').classList.remove('error');
            }, 5000);
        }

        // Function to display success message
        function showSuccess(message) {
            const successMessage = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            const errorMessage = document.getElementById('errorMessage');
            
            // Hide error message if visible
            errorMessage.style.display = 'none';
            
            // Show success message
            successText.textContent = message;
            successMessage.style.display = 'block';
            
            // Remove error classes from inputs
            document.getElementById('username').classList.remove('error');
            document.getElementById('password').classList.remove('error');
        }

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginButton');
            const rememberMe = document.getElementById('remember').checked;
            
            // Hide any previous messages
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
            
            // Basic validation
            if (!username || !password) {
                showError('Please fill in all required fields.');
                return;
            }
            
            // Show loading state
            loginBtn.innerHTML = '<div class="loading"></div> Signing In...';
            loginBtn.disabled = true;
            
            // Simulate API call delay
            setTimeout(() => {
                // Validate user credentials
                const validationResult = validateUser(username, password);
                
                if (validationResult.success) {
                    // Show success message
                    showSuccess(validationResult.message);
                    
                    // Store current user in sessionStorage for dashboard access
                    sessionStorage.setItem('currentUser', JSON.stringify(validationResult.user));
                    
                    // If "Remember me" is checked, store in localStorage
                    if (rememberMe) {
                        localStorage.setItem('rememberedUser', JSON.stringify({
                            username: username,
                            timestamp: new Date().getTime()
                        }));
                    }
                    
                    // Redirect to dashboard after a short delay
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    // Show error message
                    showError(validationResult.message);
                    
                    // Reset button state
                    loginBtn.innerHTML = 'Sign In';
                    loginBtn.disabled = false;
                }
            }, 1500);
        });

        // Check if there's a remembered user
        document.addEventListener('DOMContentLoaded', function() {
            const rememberedUser = localStorage.getItem('rememberedUser');
            
            if (rememberedUser) {
                const userData = JSON.parse(rememberedUser);
                const oneWeekAgo = new Date().getTime() - (7 * 24 * 60 * 60 * 1000); // 1 week ago
                
                // Check if remembered data is still valid (within 1 week)
                if (userData.timestamp > oneWeekAgo) {
                    document.getElementById('username').value = userData.username;
                    document.getElementById('remember').checked = true;
                } else {
                    // Clear expired remembered user
                    localStorage.removeItem('rememberedUser');
                }
            }
            
            // Check if user came from signup with success message
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('signup') === 'success') {
                showSuccess('Account created successfully! Please log in with your credentials.');
            }
        });
    </script>
</body>
</html>
