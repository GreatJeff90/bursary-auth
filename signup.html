<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | UniPort Bursary</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #003366; /* UniPort Blue */
            --secondary: #ffffff; /* White */
            --accent: #0099cc; /* Lighter blue accent */
            --light: #f8fafc; /* Light background */
            --text-dark: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            background-color: var(--light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 480px;
            background: var(--secondary);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .signup-header {
            padding: 32px 32px 24px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo img {
            height: 42px;
            width: auto;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .signup-header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .signup-header p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .signup-form {
            padding: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .input-container {
            position: relative;
        }

        .input-container i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            background: var(--secondary);
            color: var(--text-dark);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 24px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .terms input {
            margin-top: 3px;
            accent-color: var(--primary);
        }

        .terms a {
            color: var(--primary);
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: var(--secondary);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }

        .signup-btn:hover {
            background: var(--accent);
        }

        .signup-btn:active {
            transform: translateY(1px);
        }

        .login-section {
            text-align: center;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-size: 0.95rem;
            color: var(--text-light);
        }

        .login-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-link:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success message */
        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
            background: #f0f9ff;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bae6fd;
        }

        .success-message i {
            color: var(--success);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .success-message h3 {
            color: var(--success);
            margin-bottom: 10px;
        }

        .success-message p {
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Error message */
        .error-message {
            display: none;
            text-align: center;
            padding: 12px;
            background: #fef2f2;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
            color: var(--error);
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .signup-container {
                max-width: 100%;
            }
            
            .signup-header, .signup-form {
                padding: 24px;
            }
            
            .logo img {
                height: 36px;
            }
            
            .logo-text {
                font-size: 1.3rem;
            }
            
            .signup-header h1 {
                font-size: 1.5rem;
            }
            
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <div class="logo">
                <img src="https://www.uniport.edu.ng/wp-content/themes/unipix/assets/images/logo/uniport_logo1.png" alt="UniPort Logo">
                <div class="logo-text">UniPort Bursary</div>
            </div>
            
            <h1>Create Account</h1>
            <p>Sign up for a new bursary account</p>
        </div>
        
        <form class="signup-form" id="signupForm">
            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i>
                <h3>Account Created Successfully!</h3>
                <p>Redirecting to OTP verification...</p>
            </div>
            
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <div class="input-container">
                        <i class="fas fa-user"></i>
                        <input type="text" id="firstName" class="form-control" placeholder="First name" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <div class="input-container">
                        <i class="fas fa-user"></i>
                        <input type="text" id="lastName" class="form-control" placeholder="Last name" required>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="studentId">Student ID</label>
                <div class="input-container">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="studentId" class="form-control" placeholder="Enter your student ID" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-container">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="Create a password" required>
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required>
                    <button type="button" class="password-toggle" id="toggleConfirmPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="terms">
                <input type="checkbox" id="agreeTerms" required>
                <label for="agreeTerms">
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </label>
            </div>
            
            <button type="submit" class="signup-btn" id="signupButton">
                Create Account
            </button>
            
            <div class="login-section">
                Already have an account? <a href="login.html" class="login-link">Sign in</a>
            </div>
        </form>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('confirmPassword');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Function to save user data to localStorage
        function saveUserData(userData) {
            try {
                // Get existing users from localStorage or initialize empty array
                const existingUsers = JSON.parse(localStorage.getItem('uniportUsers')) || [];
                
                // Check if user already exists with the same email or student ID
                const userExists = existingUsers.some(user => 
                    user.email === userData.email || user.studentId === userData.studentId
                );
                
                if (userExists) {
                    return { success: false, message: "User with this email or student ID already exists" };
                }
                
                // Add new user to the array
                existingUsers.push(userData);
                
                // Save updated array back to localStorage
                localStorage.setItem('uniportUsers', JSON.stringify(existingUsers));
                
                return { success: true, message: "User registered successfully" };
            } catch (error) {
                console.error("Error saving user data:", error);
                return { success: false, message: "Error saving user data" };
            }
        }

        // Function to display error message
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorMessage.style.display = 'block';
            
            // Hide error after 5 seconds
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        // Form submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const signupBtn = document.getElementById('signupButton');
            const successMessage = document.getElementById('successMessage');
            
            // Hide any previous error messages
            document.getElementById('errorMessage').style.display = 'none';
            
            // Form validation
            if (!firstName || !lastName || !studentId || !email || !password || !confirmPassword) {
                showError('Please fill in all required fields!');
                return;
            }
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Please enter a valid email address!');
                return;
            }
            
            // Password validation
            if (password !== confirmPassword) {
                showError('Passwords do not match!');
                return;
            }
            
            if (password.length < 8) {
                showError('Password must be at least 8 characters long!');
                return;
            }
            
            // Show loading state
            signupBtn.innerHTML = '<div class="loading"></div> Creating Account...';
            signupBtn.disabled = true;
            
            // Prepare user data
            const userData = {
                firstName,
                lastName,
                studentId,
                email,
                password: btoa(password), // Simple encoding (not secure for production)
                registrationDate: new Date().toISOString(),
                verified: false
            };
            
            // Save user data
            const saveResult = saveUserData(userData);
            
            // Simulate API call delay
            setTimeout(() => {
                if (saveResult.success) {
                    // Show success message
                    successMessage.style.display = 'block';
                    
                    // Hide the form
                    document.querySelectorAll('.form-group, .terms, .login-section').forEach(el => {
                        el.style.display = 'none';
                    });
                    
                    // In a real app, you would redirect to OTP verification page
                    setTimeout(() => {
                        // Pass the email as a parameter to the OTP verification page
                        window.location.href = `otp-verification.html?email=${encodeURIComponent(email)}`;
                    }, 2000);
                } else {
                    // Show error message
                    showError(saveResult.message);
                    
                    // Reset button state
                    signupBtn.innerHTML = 'Create Account';
                    signupBtn.disabled = false;
                }
            }, 1500);
        });
    </script>
</body>
</html>
