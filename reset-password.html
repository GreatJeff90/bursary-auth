<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Bursary System</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="university-header">
                <h1>Reset Your Password</h1>
                <p>Enter your email to receive reset instructions</p>
            </div>
            
            <form id="resetForm" class="auth-form">
                <div class="form-group">
                    <label for="email">University Email Address</label>
                    <input type="email" id="email" name="email" required 
                           placeholder="your.email@uniport.edu.ng">
                    <span class="error-message" id="emailError"></span>
                </div>
                
                <button type="submit" class="btn-primary" id="resetBtn">
                    <span class="btn-text">Send Reset Instructions</span>
                    <span class="btn-loading hidden">Sending...</span>
                </button>
            </form>
            
            <div class="success-message hidden" id="successMessage">
                <div class="success-icon">✓</div>
                <h3>Reset Email Sent!</h3>
                <p>Check your email for password reset instructions. The link will expire in 1 hour.</p>
            </div>
            
            <div class="form-footer">
                <a href="index.html" class="link">← Back to Login</a>
            </div>
        </div>
    </div>
    
    <script src="scripts/auth.js"></script>
</body>
</html>
